name: ProfileRequestContract
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  SWIFT_VERSION: '6.0'
  SWIFT_STRICT_CONCURRENCY: complete
  GENERATE_INFOPLIST_FILE: YES
  CODE_SIGNING_ALLOWED: NO
  ENABLE_TESTABILITY: YES
targets:
  ProfileContract:
    type: framework
    platform: iOS
    sources: [Sources]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.keyatlas.contract.framework
  ProfileContractTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ProfileContract
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.keyatlas.contract.tests
schemes:
  ProfileRequestContract:
    build:
      targets:
        ProfileContract: all
        ProfileContractTests: [test]
    test:
      targets: [ProfileContractTests]
